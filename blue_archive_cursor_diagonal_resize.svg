<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blue Archive Style Mouse Cursor - Diagonal Resize (NESW)
  蔚蓝档案风格鼠标指针 - 对角线调整大小 (右上-左下)
  
  Design: Double-headed diagonal arrow with halo elements
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="64" height="64" 
     viewBox="0 0 64 64">
  
  <defs>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    
    <filter id="haloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Top-right arrow head -->
  <path d="M 52,12 L 40,24 L 44,28 L 40,32 L 48,40 L 52,36 L 56,40 Z" 
        fill="url(#arrowGradient)" 
        stroke="#0077b6" 
        stroke-width="1.5"
        stroke-linejoin="round"/>
  
  <!-- Bottom-left arrow head -->
  <path d="M 12,52 L 24,40 L 20,36 L 24,32 L 16,24 L 12,28 L 8,24 Z" 
        fill="url(#arrowGradient)" 
        stroke="#0077b6" 
        stroke-width="1.5"
        stroke-linejoin="round"/>
  
  <!-- Center bar connecting arrows -->
  <rect x="22" y="30" width="20" height="4" rx="2" ry="2"
        transform="rotate(-45 32 32)"
        fill="url(#arrowGradient)" 
        stroke="#0077b6" 
        stroke-width="1.5"/>
  
  <!-- Inner highlight top-right arrow -->
  <path d="M 50,16 L 42,24 L 45,27 L 42,30 L 47,35 L 50,32 L 53,35 Z" 
        fill="#ffffff" 
        opacity="0.5"/>
  
  <!-- Inner highlight bottom-left arrow -->
  <path d="M 14,48 L 22,40 L 19,37 L 22,34 L 17,29 L 14,32 L 11,29 Z" 
        fill="#ffffff" 
        opacity="0.5"/>
  
  <!-- Blue accent diagonal line -->
  <line x1="14" y1="50" x2="50" y2="14" 
        stroke="url(#blueAccent)" 
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <!-- Halo ring at center -->
  <circle cx="32" cy="32" r="7" 
          fill="none" 
          stroke="#00a8e8" 
          stroke-width="1.5"
          filter="url(#haloGlow)"
          opacity="0.9"/>
  
  <circle cx="32" cy="32" r="4" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1"
          opacity="0.7"/>
  
  <!-- Star sparkle at center -->
  <path d="M 32,28 L 32,36 M 28,32 L 36,32" 
        stroke="#ffd700" 
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <!-- Sparkles at arrow tips -->
  <path d="M 54,14 L 56,16 M 52,12 L 54,14" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.7"/>
  
  <path d="M 10,50 L 12,52 M 8,48 L 10,50" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.7"/>
  
  <!-- Decorative dots -->
  <circle cx="45" cy="18" r="1.5" fill="#00a8e8" opacity="0.7"/>
  <circle cx="52" cy="25" r="1.5" fill="#00a8e8" opacity="0.7"/>
  <circle cx="12" cy="38" r="1.5" fill="#ffd700" opacity="0.6"/>
  <circle cx="19" cy="45" r="1.5" fill="#ffd700" opacity="0.6"/>
  
  <!-- Side sparkles -->
  <path d="M 20,24 L 23,24 M 21.5,22.5 L 21.5,25.5" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.6"/>
  
  <path d="M 41,40 L 44,40 M 42.5,38.5 L 42.5,41.5" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.6"/>
  
  <!-- Additional glow dots -->
  <circle cx="25" cy="22" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="39" cy="42" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="48" cy="30" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="16" cy="34" r="1" fill="#00d4ff" opacity="0.5"/>
  
</svg>
