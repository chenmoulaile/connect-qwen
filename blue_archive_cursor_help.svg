<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blue Archive Style Mouse Cursor - Help
  蔚蓝档案风格鼠标指针 - 帮助
  
  Design: Arrow with question mark and halo elements
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="64" height="64" 
     viewBox="0 0 64 64">
  
  <defs>
    <linearGradient id="cursorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    
    <filter id="haloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <radialGradient id="questionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main cursor arrow body -->
  <path d="M 8,4 L 8,52 L 16,44 L 24,56 L 32,52 L 24,40 L 32,40 Z" 
        fill="url(#cursorGradient)" 
        stroke="#0077b6" 
        stroke-width="2"
        stroke-linejoin="round"/>
  
  <!-- Inner highlight -->
  <path d="M 12,12 L 12,45 L 17,40 L 22,48 L 26,46 L 21,38 L 26,38 Z" 
        fill="#ffffff" 
        opacity="0.6"/>
  
  <!-- Blue accent stripe -->
  <path d="M 10,8 L 10,48 L 14,44 L 18,50 L 22,48 L 18,40 L 24,40" 
        fill="none" 
        stroke="url(#blueAccent)" 
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8"/>
  
  <!-- Halo ring at tip -->
  <circle cx="8" cy="6" r="5" 
          fill="none" 
          stroke="#00a8e8" 
          stroke-width="1.5"
          filter="url(#haloGlow)"
          opacity="0.9"/>
  
  <circle cx="8" cy="6" r="3" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1"
          opacity="0.7"/>
  
  <!-- Question mark symbol (stylized) -->
  <g transform="translate(36, 20)">
    <!-- Glow background for question mark -->
    <ellipse cx="8" cy="10" rx="10" ry="12" fill="url(#questionGlow)" opacity="0.6"/>
    
    <!-- Question mark curve -->
    <path d="M 8,4 C 4,4 3,7 3,9 L 3,10 M 8,4 C 12,4 13,7 13,9 L 13,11 C 13,14 11,16 8,16" 
          fill="none" 
          stroke="#0077b6" 
          stroke-width="2.5"
          stroke-linecap="round"/>
    
    <!-- Inner highlight on question mark -->
    <path d="M 8,6 C 5,6 4.5,8 4.5,9 L 4.5,9.5" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1.5"
          stroke-linecap="round"
          opacity="0.8"/>
    
    <!-- Question mark dot -->
    <circle cx="8" cy="19" r="2" 
            fill="#00a8e8"
            opacity="0.9"/>
    
    <circle cx="8" cy="19" r="1" 
            fill="#ffffff"
            opacity="0.7"/>
    
    <!-- Small sparkles around question mark -->
    <path d="M 2,10 L 4,10 M 12,10 L 14,10" 
          stroke="#ffd700" 
          stroke-width="0.8"
          stroke-linecap="round"
          opacity="0.6"/>
    
    <path d="M 8,2 L 8,4 M 8,16 L 8,18" 
          stroke="#ffd700" 
          stroke-width="0.8"
          stroke-linecap="round"
          opacity="0.6"/>
  </g>
  
  <!-- Additional decorative elements on cursor -->
  <circle cx="36" cy="16" r="1.5" fill="#00a8e8" opacity="0.7"/>
  <circle cx="14" cy="58" r="1" fill="#ffd700" opacity="0.6"/>
  
  <!-- Extra sparkle near question mark -->
  <path d="M 50,30 L 53,30 M 51.5,28.5 L 51.5,31.5" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.5"/>
  
</svg>
