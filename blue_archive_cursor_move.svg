<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blue Archive Style Mouse Cursor - Move (All Directions)
  蔚蓝档案风格鼠标指针 - 移动 (四向箭头)
  
  Design: Four-directional arrow cross with halo center
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="64" height="64" 
     viewBox="0 0 64 64">
  
  <defs>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    
    <filter id="haloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Center square -->
  <rect x="26" y="26" width="12" height="12" rx="3" ry="3"
        fill="url(#arrowGradient)" 
        stroke="#0077b6" 
        stroke-width="1.5"/>
  
  <!-- Top arrow -->
  <path d="M 28,26 L 32,16 L 36,26 Z" 
        fill="url(#arrowGradient)" 
        stroke="#0077b6" 
        stroke-width="1.5"
        stroke-linejoin="round"/>
  
  <!-- Bottom arrow -->
  <path d="M 28,38 L 32,48 L 36,38 Z" 
        fill="url(#arrowGradient)" 
        stroke="#0077b6" 
        stroke-width="1.5"
        stroke-linejoin="round"/>
  
  <!-- Left arrow -->
  <path d="M 26,28 L 16,32 L 26,36 Z" 
        fill="url(#arrowGradient)" 
        stroke="#0077b6" 
        stroke-width="1.5"
        stroke-linejoin="round"/>
  
  <!-- Right arrow -->
  <path d="M 38,28 L 48,32 L 38,36 Z" 
        fill="url(#arrowGradient)" 
        stroke="#0077b6" 
        stroke-width="1.5"
        stroke-linejoin="round"/>
  
  <!-- Inner highlight for center -->
  <rect x="29" y="29" width="6" height="6" rx="1.5" ry="1.5"
        fill="#ffffff" 
        opacity="0.6"/>
  
  <!-- Blue accent lines on arrows -->
  <line x1="32" y1="20" x2="32" y2="26" 
        stroke="url(#blueAccent)" 
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <line x1="32" y1="38" x2="32" y2="44" 
        stroke="url(#blueAccent)" 
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <line x1="20" y1="32" x2="26" y2="32" 
        stroke="url(#blueAccent)" 
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <line x1="38" y1="32" x2="44" y2="32" 
        stroke="url(#blueAccent)" 
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <!-- Large halo ring at center -->
  <circle cx="32" cy="32" r="9" 
          fill="none" 
          stroke="#00a8e8" 
          stroke-width="1.5"
          filter="url(#haloGlow)"
          opacity="0.9"/>
  
  <circle cx="32" cy="32" r="6" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1"
          opacity="0.8"/>
  
  <!-- Central star/sparkle -->
  <path d="M 32,28 L 32,36 M 28,32 L 36,32" 
        stroke="#ffd700" 
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.9"/>
  
  <path d="M 29,29 L 35,35 M 29,35 L 35,29" 
        stroke="#ffd700" 
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.7"/>
  
  <!-- Sparkles at arrow tips -->
  <path d="M 32,14 L 32,17 M 30.5,15.5 L 33.5,15.5" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.7"/>
  
  <path d="M 32,47 L 32,50 M 30.5,48.5 L 33.5,48.5" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.7"/>
  
  <path d="M 14,32 L 17,32 M 15.5,30.5 L 15.5,33.5" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.7"/>
  
  <path d="M 47,32 L 50,32 M 48.5,30.5 L 48.5,33.5" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.7"/>
  
  <!-- Decorative dots between arrows -->
  <circle cx="22" cy="22" r="1.5" fill="#00a8e8" opacity="0.7"/>
  <circle cx="42" cy="22" r="1.5" fill="#ffd700" opacity="0.6"/>
  <circle cx="22" cy="42" r="1.5" fill="#ffd700" opacity="0.6"/>
  <circle cx="42" cy="42" r="1.5" fill="#00a8e8" opacity="0.7"/>
  
  <!-- Additional glow dots -->
  <circle cx="18" cy="26" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="46" cy="26" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="18" cy="38" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="46" cy="38" r="1" fill="#00d4ff" opacity="0.5"/>
  
</svg>
