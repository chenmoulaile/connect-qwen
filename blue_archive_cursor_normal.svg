<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blue Archive Style Mouse Cursor - Normal Select
  蔚蓝档案风格鼠标指针 - 正常选择
  
  Design elements:
  - Halo ring motif (光环元素)
  - Blue and white color scheme (蓝白配色)
  - Clean, modern aesthetic (简洁现代风格)
  - Star/sparkle accents (星光点缀)
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="64" height="64" 
     viewBox="0 0 64 64">
  
  <defs>
    <!-- Gradient for main cursor body -->
    <linearGradient id="cursorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Blue accent gradient -->
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Halo glow effect -->
    <filter id="haloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Sparkle effect -->
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main cursor arrow body -->
  <path d="M 8,4 L 8,52 L 16,44 L 24,56 L 32,52 L 24,40 L 32,40 Z" 
        fill="url(#cursorGradient)" 
        stroke="#0077b6" 
        stroke-width="2"
        stroke-linejoin="round"/>
  
  <!-- Inner highlight -->
  <path d="M 12,12 L 12,45 L 17,40 L 22,48 L 26,46 L 21,38 L 26,38 Z" 
        fill="#ffffff" 
        opacity="0.6"/>
  
  <!-- Blue accent stripe along edge -->
  <path d="M 10,8 L 10,48 L 14,44 L 18,50 L 22,48 L 18,40 L 24,40" 
        fill="none" 
        stroke="url(#blueAccent)" 
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8"/>
  
  <!-- Halo ring at cursor tip -->
  <circle cx="8" cy="6" r="5" 
          fill="none" 
          stroke="#00a8e8" 
          stroke-width="1.5"
          filter="url(#haloGlow)"
          opacity="0.9"/>
  
  <!-- Inner halo ring -->
  <circle cx="8" cy="6" r="3" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1"
          opacity="0.7"/>
  
  <!-- Small sparkle stars around halo -->
  <path d="M 3,6 L 13,6 M 8,1 L 8,11" 
        stroke="#ffd700" 
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <path d="M 30,10 L 34,10 M 32,8 L 32,12" 
        stroke="#ffd700" 
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.6"/>
  
  <path d="M 28,50 L 31,50 M 29.5,48.5 L 29.5,51.5" 
        stroke="#ffd700" 
        stroke-width="0.6"
        stroke-linecap="round"
        opacity="0.5"/>
  
  <!-- Additional decorative dots -->
  <circle cx="36" cy="16" r="1.5" fill="#00a8e8" opacity="0.7"/>
  <circle cx="14" cy="58" r="1" fill="#ffd700" opacity="0.6"/>
  
</svg>
