<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blue Archive Style Mouse Cursor - Unavailable/Disabled
  蔚蓝档案风格鼠标指针 - 不可用/禁用
  
  Design: Arrow with prohibition circle overlay
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="64" height="64" 
     viewBox="0 0 64 64">
  
  <defs>
    <linearGradient id="cursorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grayAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a0a0a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#707070;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="prohibitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c92a2a;stop-opacity:1" />
    </linearGradient>
    
    <filter id="haloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Main cursor arrow body (slightly faded) -->
  <path d="M 8,4 L 8,52 L 16,44 L 24,56 L 32,52 L 24,40 L 32,40 Z" 
        fill="url(#cursorGradient)" 
        stroke="#707070" 
        stroke-width="2"
        stroke-linejoin="round"
        opacity="0.7"/>
  
  <!-- Inner highlight -->
  <path d="M 12,12 L 12,45 L 17,40 L 22,48 L 26,46 L 21,38 L 26,38 Z" 
        fill="#ffffff" 
        opacity="0.4"/>
  
  <!-- Gray accent stripe -->
  <path d="M 10,8 L 10,48 L 14,44 L 18,50 L 22,48 L 18,40 L 24,40" 
        fill="none" 
        stroke="url(#grayAccent)" 
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.6"/>
  
  <!-- Halo ring at tip (dimmed) -->
  <circle cx="8" cy="6" r="5" 
          fill="none" 
          stroke="#a0a0a0" 
          stroke-width="1.5"
          filter="url(#haloGlow)"
          opacity="0.5"/>
  
  <circle cx="8" cy="6" r="3" 
          fill="none" 
          stroke="#d0d0d0" 
          stroke-width="1"
          opacity="0.4"/>
  
  <!-- Prohibition circle overlay -->
  <g transform="translate(32, 36)">
    <!-- Outer glow -->
    <circle cx="12" cy="12" r="14" 
            fill="none" 
            stroke="#ff6b6b" 
            stroke-width="1"
            filter="url(#haloGlow)"
            opacity="0.4"/>
    
    <!-- Prohibition circle -->
    <circle cx="12" cy="12" r="11" 
            fill="none" 
            stroke="url(#prohibitGradient)" 
            stroke-width="2.5"/>
    
    <!-- Diagonal line -->
    <line x1="4" y1="4" x2="20" y2="20" 
          stroke="url(#prohibitGradient)" 
          stroke-width="2.5"
          stroke-linecap="round"/>
    
    <!-- Inner fade -->
    <circle cx="12" cy="12" r="9" 
            fill="#ffffff" 
            opacity="0.1"/>
    
    <!-- Small sparkles (dimmed) -->
    <path d="M 12,6 L 12,8 M 10,7 L 14,7" 
          stroke="#ffd700" 
          stroke-width="0.6"
          stroke-linecap="round"
          opacity="0.3"/>
    
    <path d="M 6,12 L 8,12 M 16,12 L 18,12" 
          stroke="#ffd700" 
          stroke-width="0.6"
          stroke-linecap="round"
          opacity="0.3"/>
  </g>
  
  <!-- Faded decorative dots -->
  <circle cx="36" cy="16" r="1.5" fill="#a0a0a0" opacity="0.5"/>
  <circle cx="14" cy="58" r="1" fill="#c0c0c0" opacity="0.4"/>
  
</svg>
