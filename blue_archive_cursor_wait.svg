<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blue Archive Style Mouse Cursor - Work in Background
  蔚蓝档案风格鼠标指针 - 后台工作
  
  Design: Arrow with small busy indicator overlay
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="64" height="64" 
     viewBox="0 0 64 64">
  
  <defs>
    <linearGradient id="cursorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    
    <filter id="haloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Main cursor arrow body -->
  <path d="M 8,4 L 8,52 L 16,44 L 24,56 L 32,52 L 24,40 L 32,40 Z" 
        fill="url(#cursorGradient)" 
        stroke="#0077b6" 
        stroke-width="2"
        stroke-linejoin="round"/>
  
  <!-- Inner highlight -->
  <path d="M 12,12 L 12,45 L 17,40 L 22,48 L 26,46 L 21,38 L 26,38 Z" 
        fill="#ffffff" 
        opacity="0.6"/>
  
  <!-- Blue accent stripe -->
  <path d="M 10,8 L 10,48 L 14,44 L 18,50 L 22,48 L 18,40 L 24,40" 
        fill="none" 
        stroke="url(#blueAccent)" 
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8"/>
  
  <!-- Halo ring at tip -->
  <circle cx="8" cy="6" r="5" 
          fill="none" 
          stroke="#00a8e8" 
          stroke-width="1.5"
          filter="url(#haloGlow)"
          opacity="0.9"/>
  
  <circle cx="8" cy="6" r="3" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1"
          opacity="0.7"/>
  
  <!-- Small sparkle at tip -->
  <path d="M 3,6 L 13,6 M 8,1 L 8,11" 
        stroke="#ffd700" 
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <!-- Small circular progress indicator (bottom right) -->
  <g transform="translate(42, 42)">
    <!-- Outer ring -->
    <circle cx="10" cy="10" r="9" 
            fill="none" 
            stroke="#0077b6" 
            stroke-width="1.5"
            opacity="0.3"/>
    
    <!-- Progress arc segment 1 -->
    <path d="M 10,1 A 9,9 0 0,1 16,5" 
          fill="none" 
          stroke="#00a8e8" 
          stroke-width="2"
          stroke-linecap="round"
          filter="url(#haloGlow)"/>
    
    <!-- Progress arc segment 2 -->
    <path d="M 19,10 A 9,9 0 0,1 17,16" 
          fill="none" 
          stroke="#00a8e8" 
          stroke-width="2"
          stroke-linecap="round"
          filter="url(#haloGlow)"
          opacity="0.7"/>
    
    <!-- Center dot -->
    <circle cx="10" cy="10" r="3" 
            fill="#ffffff"
            opacity="0.9"/>
    
    <!-- Tiny sparkle -->
    <path d="M 10,8 L 10,12 M 8,10 L 12,10" 
          stroke="#ffd700" 
          stroke-width="0.8"
          stroke-linecap="round"
          opacity="0.8"/>
  </g>
  
  <!-- Additional decorative dots on cursor -->
  <circle cx="36" cy="16" r="1.5" fill="#00a8e8" opacity="0.7"/>
  <circle cx="14" cy="58" r="1" fill="#ffd700" opacity="0.6"/>
  
  <!-- Extra sparkles around progress indicator -->
  <circle cx="55" cy="40" r="1" fill="#ffd700" opacity="0.5"/>
  <circle cx="56" cy="52" r="1" fill="#00d4ff" opacity="0.4"/>
  
</svg>
